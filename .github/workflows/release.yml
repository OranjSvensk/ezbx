name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to exact commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Privacy scan
        run: |
          sh scripts/privacy-scan-test.sh
          sh scripts/privacy-scan.sh --all
          sh scripts/privacy-scan.sh --history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with the race detector
        run: go test -race ./...

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build release archives
        run: |
          set -eu
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          ldflags="-s -w -X main.version=${tag}"

          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            stage="stage-${goos}-${goarch}"
            mkdir -p "${stage}"
            bin="ezbx"
            if [ "${goos}" = "windows" ]; then
              bin="ezbx.exe"
            fi
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags="${ldflags}" -o "${stage}/${bin}" ./cmd/ezbx
            cp README.md LICENSE ezbx.toml.example "${stage}/"
            if [ "${goos}" = "windows" ]; then
              (cd "${stage}" && zip -q "../dist/ezbx-${tag}-${goos}-${goarch}.zip" "${bin}" README.md LICENSE ezbx.toml.example)
            else
              tar -C "${stage}" -czf "dist/ezbx-${tag}-${goos}-${goarch}.tar.gz" "${bin}" README.md LICENSE ezbx.toml.example
            fi
          done

          (cd dist && sha256sum ezbx-* > checksums.txt)
      - name: Verify the Linux amd64 release archive
        run: |
          set -eu
          (cd dist && sha256sum --check checksums.txt)
          unpacked="$(mktemp -d)"
          tar -xzf "dist/ezbx-${GITHUB_REF_NAME}-linux-amd64.tar.gz" -C "${unpacked}"
          cd "${unpacked}"
          ./ezbx version --json | jq -e --arg version "${GITHUB_REF_NAME#v}" \
            '.ok and .version == $version and .contractVersion == 1 and .platform == "linux/amd64"'
          python3 "${GITHUB_WORKSPACE}/scripts/test-runtime-events.py" --ezbx ./ezbx --harness pi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          notes_file="$(mktemp)"
          cat <<EOF > "${notes_file}"
          Early release ${tag}.

          - **Recovery:** The doctor diagnoses a stopped or missing box container and gives commands to recreate it while preserving the workspace, agent home, and snapshots.
          - **Gateway activity:** Fixed intermittent file-sharing errors in the Windows event reader. The Pi fixture tests reconnect, deduplication, and recovery after a replay gap.
          - **Windows:** Pi and OpenCode passed the fake-engine acceptance runs on Docker Desktop.
          - **Native Linux pilot:** All seven harnesses returned text completions through the gateway on Ubuntu 24.04 and 26.04 amd64 with local Docker Engine and a keyed fake model server. The published Linux amd64 archive also passed the Pi acceptance test before publication. See the [pilot setup and scope](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/getting-started.md#native-linux-pilot).
          - **Getting started:** Download an archive below (verify against \`checksums.txt\`) or install with \`go install github.com/OranjSvensk/ezbx/cmd/ezbx@${tag}\`, then see [docs/getting-started.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/getting-started.md).

          EOF
          gh release create "${tag}" dist/* --title "ezbx ${tag}" --notes-file "${notes_file}" --generate-notes
