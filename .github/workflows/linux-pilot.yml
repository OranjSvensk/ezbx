name: Linux runtime pilot

on:
  push:
    branches:
      - main
      - probatio/linux-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
        harness: [pi, opencode, omp, codex, claude, hermes, openclaw]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Identify the runner and Docker Engine
        run: |
          cat /etc/os-release
          uname -m
          docker version
      - name: Run the Docker acceptance test
        env:
          PILOT_HARNESS: ${{ matrix.harness }}
        run: python3 scripts/test-runtime-events.py --harness "$PILOT_HARNESS"
