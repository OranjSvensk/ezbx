name: Linux runtime pilot

on:
  push:
    branches:
      - main
      - probatio/linux-pilot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Identify the runner and Docker Engine
        run: |
          uname -m
          docker version
      - name: Run the Docker acceptance test
        run: python3 scripts/test-runtime-events.py
