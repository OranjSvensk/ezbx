# ezbx.lock: the pinned inputs of the ezbx images.
#
# Generated from the Dockerfiles, the harness folders and the tool catalogue,
# so don't edit it by hand. After changing those, regenerate it with
#   go test ./internal/images -run TestLockFile -update
# and the tests fail while it is out of date.
#
# The box image's Debian packages come from the dated snapshot its base image
# was made from, so the base image's digest also fixes their versions.
# ezbx build records the versions it got in images.json, next to ezbx.toml.
version = 1

[images.gateway]
dockerfile = "docker/gateway.Dockerfile"
GO_IMAGE = "golang:1.27.4@sha256:205c7636d74e0ffbe3d007162df7d74f859f5a8c8322dfb9f907977686c126cf"

[images.box]
dockerfile = "docker/box.Dockerfile"
NODE_IMAGE = "node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54"

[harnesses.claude]
type = "npm"
package = "@anthropic-ai/claude-code-linux-x64"
version = "2.1.330"
verified = "verified"
lockfile = "harnesses/claude/package-lock.json"
lockfile_sha256 = "83bfe9050786600865c7ba5a0b9261b511eb6fb2d90c14ef71777659d581329e"
tools = ["ripgrep"]

[harnesses.codex]
type = "npm"
package = "@openai/codex"
version = "0.171.0"
verified = "verified"
lockfile = "harnesses/codex/package-lock.json"
lockfile_sha256 = "4e1dd52662063e63caa3b6a8fd59829d90ddc30b23bb38b4695704ef6436ba33"
tools = ["ripgrep"]

[harnesses.hermes]
type = "pip"
package = "hermes-agent"
version = "0.19.0"
verified = "verified"
lockfile = "harnesses/hermes/requirements.lock"
lockfile_sha256 = "5c106b8cf05292f19902b9c01d1c996eca7169a8bfb24d30ed5e48de548e0f96"
tools = ["python3", "ripgrep"]

[harnesses.omp]
